[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpncheck"
version = "0.1.0.dev0"
description = "Model checking for Coloured Petri Nets, cross-checked against CPN Tools"
authors = [{ name = "GrupoCybersegurancaVirtus" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">= 3.8"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/GrupoCybersegurancaVirtus/cpncheck"
Issues = "https://github.com/GrupoCybersegurancaVirtus/cpncheck/issues"

[project.scripts]
cpncheck = "cpncheck.cli:main"

[tool.setuptools.packages.find]
include = ["cpncheck*"]
